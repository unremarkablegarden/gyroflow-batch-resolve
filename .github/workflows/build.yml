name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python packaging/build.py
      # ditto keeps the .app bundle's symlinks and signature; zip -r does not.
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist gyroflow-batch-resolve-${{ matrix.name }}.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath gyroflow-batch-resolve-${{ matrix.name }}.zip
      - if: runner.os == 'Linux'
        run: cd dist && zip -r -y ../gyroflow-batch-resolve-${{ matrix.name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gyroflow-batch-resolve-${{ matrix.name }}
          path: gyroflow-batch-resolve-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: gyroflow-batch-resolve-*.zip
          generate_release_notes: true
